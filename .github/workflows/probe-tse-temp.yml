name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Listar releases do turicas/eleicoes-brasil (mirror de dados do TSE)
        run: |
          set -x
          curl -sS "https://api.github.com/repos/turicas/eleicoes-brasil/releases?per_page=100" -o /tmp/releases.json
          python3 - <<'PYEOF'
          import json
          releases = json.load(open('/tmp/releases.json'))
          if isinstance(releases, dict):
              print("ERRO:", releases)
          else:
              print(f"{len(releases)} releases")
              for r in releases[:20]:
                  print("---", r.get('tag_name'), r.get('name'))
                  for a in r.get('assets', []):
                      print("   ", a.get('name'), a.get('size'), a.get('browser_download_url'))
          PYEOF

      - name: Listar conteúdo do repositório (pastas/branches) pra achar dados prontos
        run: |
          set -x
          curl -sS "https://api.github.com/repos/turicas/eleicoes-brasil/contents/" -o /tmp/contents.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/contents.json'))
          if isinstance(d, dict):
              print("ERRO:", d)
          else:
              for item in d:
                  print(item.get('type'), item.get('name'))
          PYEOF
