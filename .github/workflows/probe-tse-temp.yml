name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Testa acesso ao cdn.tse.jus.br (arquivo de votacao por municipio/zona 2026)
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          echo "=== HEAD no zip nacional ==="
          curl -sS -I --max-time 20 -A "$UA" \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_2026.zip" || echo "FALHOU head"
