name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixa o zip e lista o conteudo (sem extrair tudo)
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          curl -sS --max-time 1200 --retry 2 -A "$UA" -o /tmp/votacao.zip \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_2026.zip"
          ls -la /tmp/votacao.zip
          echo "=== listagem do zip ==="
          unzip -l /tmp/votacao.zip | head -60
          echo "=== arquivos com GO no nome ==="
          unzip -l /tmp/votacao.zip | grep -i "_GO" || echo "nenhum com _GO"
