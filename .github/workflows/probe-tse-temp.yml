name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Buscar pacote CKAN
        run: |
          set -x
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            "https://dadosabertos.tse.jus.br/api/3/action/package_search?q=votacao+candidato+munzona+2022&rows=5" \
            -o /tmp/pkg.json
          python3 -c "
import json
d = json.load(open('/tmp/pkg.json'))
res = d['result']['results']
print('COUNT', len(res))
for p in res:
    print('---')
    print('name:', p['name'])
    print('title:', p['title'])
    print('num_resources:', len(p.get('resources', [])))
"

      - name: Listar recursos do primeiro pacote
        run: |
          python3 -c "
import json
d = json.load(open('/tmp/pkg.json'))
res = d['result']['results']
p = res[0]
for r in p.get('resources', []):
    print(r.get('format'), '|', r.get('name'), '|', r.get('url'))
" | head -100

      - name: Achar recurso de GO e baixar
        run: |
          set -x
          python3 -c "
import json
d = json.load(open('/tmp/pkg.json'))
res = d['result']['results']
p = res[0]
resources = p.get('resources', [])
go = [r for r in resources if r.get('format','').upper()=='CSV' and 'GO' in r.get('name','').upper()]
print('GO matches:', len(go))
for r in go:
    print(r.get('name'), '|', r.get('url'))
if go:
    with open('/tmp/go_url.txt', 'w') as f:
        f.write(go[0]['url'])
"
          if [ -f /tmp/go_url.txt ]; then
            URL=$(cat /tmp/go_url.txt)
            echo "URL: $URL"
            curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              -o /tmp/go.csv.zip "$URL" || curl -sS -A "Mozilla/5.0" -o /tmp/go.data "$URL"
            ls -la /tmp/go.csv.zip /tmp/go.data 2>/dev/null || true
            file /tmp/go.csv.zip 2>/dev/null || true
          fi

      - name: Extrair
        run: |
          set -x
          cd /tmp
          if [ -f go.csv.zip ]; then
            unzip -o go.csv.zip -d go_extracted || true
            ls -la go_extracted || true
          fi

      - name: Inspecionar
        run: |
          set -x
          cd /tmp
          F=$(find go_extracted -iname "*.csv" 2>/dev/null | head -1)
          if [ -z "$F" ] && [ -f go.data ]; then F=go.data; fi
          echo "ARQUIVO: $F"
          if [ -n "$F" ]; then
            iconv -f ISO-8859-1 -t UTF-8 "$F" | head -1
            echo "=== total linhas ==="
            wc -l "$F"
            echo "=== grep Alessandro Moreira (deputado estadual conhecido) ==="
            iconv -f ISO-8859-1 -t UTF-8 "$F" | grep -i "ALESSANDRO MOREIRA" | head -5
            echo "=== grep um deputado federal conhecido (Adriano do Baldy) ==="
            iconv -f ISO-8859-1 -t UTF-8 "$F" | grep -i "BALDY" | head -5
            echo "=== cargos distintos ==="
            iconv -f ISO-8859-1 -t UTF-8 "$F" | awk -F';' 'NR==1{for(i=1;i<=NF;i++) if($i ~ /DS_CARGO/) col=i} NR>1{print $col}' | sort -u
          fi
