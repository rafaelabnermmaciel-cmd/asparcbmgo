name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Testar variações de acesso ao dadosabertos.tse.jus.br
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "=== homepage ==="
          curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" -o /tmp/a.html "https://dadosabertos.tse.jus.br/"
          head -c 300 /tmp/a.html; echo ""
          echo "=== dataset page (html, sem /api/) ==="
          curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" -o /tmp/b.html "https://dadosabertos.tse.jus.br/dataset/resultados-2022"
          head -c 300 /tmp/b.html; echo ""
          echo "=== package_show (endpoint de API diferente) ==="
          curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" -o /tmp/c.json "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=resultados-2022"
          head -c 500 /tmp/c.json; echo ""
          echo "=== sem User-Agent nenhum ==="
          curl -sS -w "\nHTTP %{http_code}\n" -o /tmp/d.json "https://dadosabertos.tse.jus.br/api/3/action/package_search?q=teste" 2>&1
          head -c 300 /tmp/d.json; echo ""

      - name: Testar divulgacandcontas.tse.jus.br (outro sistema, candidatos + resultado final)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "=== homepage divulgacandcontas ==="
          curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" -o /tmp/e.html "https://divulgacandcontas.tse.jus.br/divulga/"
          head -c 500 /tmp/e.html; echo ""
          grep -oE '(src|href)="[^"]*\.js[^"]*"' /tmp/e.html | sort -u | head -20
