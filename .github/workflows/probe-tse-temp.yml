name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: painel-captacao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/resource-capture-panel-rxvxiu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixa o zip do TSE e extrai so o CSV de Goias
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          curl -sS --max-time 1200 --retry 2 -A "$UA" -o /tmp/votacao.zip \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_2026.zip"
          unzip -j -o /tmp/votacao.zip "votacao_candidato_munzona_2026_GO.csv" -d /tmp
          ls -la /tmp/votacao_candidato_munzona_2026_GO.csv
          rm -f /tmp/votacao.zip
      - name: Calcula o top 10 municipios por parlamentar e mescla em votos-go-2026.json
        run: node scripts/gerar-municipios-votos-go-2026.js /tmp/votacao_candidato_munzona_2026_GO.csv
      - name: Commita e envia o resultado pra branch de trabalho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/votos-go-2026.json
          if git diff --cached --quiet; then
            echo "Nada mudou — nada pra commitar."
          else
            git commit -m "data: adiciona top 10 municipios por parlamentar na eleicao de 2026"
            git push origin HEAD:claude/resource-capture-panel-rxvxiu
          fi
