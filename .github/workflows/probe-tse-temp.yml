name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Achar snapshot de 2022 do ele-c.json no Wayback Machine
        run: |
          set -x
          curl -sS --max-time 15 "https://archive.org/wayback/available?url=resultados.tse.jus.br/oficial/comum/config/ele-c.json&timestamp=20221101" || echo "FALHOU available"

      - name: Baixar o snapshot exato confirmado (id_ = conteúdo bruto, sem reescrita)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS --max-time 25 -A "$UA" -o /tmp/wb.json "https://web.archive.org/web/20221102031545id_/https://resultados.tse.jus.br/oficial/comum/config/ele-c.json"
          wc -c /tmp/wb.json

      - name: Ver o conteúdo completo do catálogo ele-c.json (procurar template de arquivo)
        run: |
          cat /tmp/wb.json
          echo ""
          echo "=== tamanho ==="
          wc -c /tmp/wb.json

      - name: Reconferir bloqueio do cdn.tse.jus.br (zip oficial votacao_candidato_munzona)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS --max-time 20 -A "$UA" -o /tmp/zip.bin -w "http_code=%{http_code} tamanho=%{size_download}\n" "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_2022.zip" || echo "FALHOU"
          file /tmp/zip.bin || true
          head -c 300 /tmp/zip.bin || true
          echo ""

      - name: Procurar mirrors no GitHub com os dados já extraídos
        run: |
          set -x
          git clone --depth 1 https://github.com/jrvidotti/extracao_dados_eleicao_br /tmp/repo1 2>&1 | tail -20
          find /tmp/repo1 -iname "*.csv" -o -iname "*.zip" | head -30
          echo "=== tamanho do repo ==="
          du -sh /tmp/repo1 2>/dev/null || true
          echo ""
          git clone --depth 1 https://github.com/derikfernandes/eleicoes_2022 /tmp/repo2 2>&1 | tail -20
          find /tmp/repo2 -iname "*.csv" -o -iname "*.zip" | head -30
          du -sh /tmp/repo2 2>/dev/null || true
