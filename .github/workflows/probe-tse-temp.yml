name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar index + runtime.js e extrair mapa de chunks
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -o /tmp/index.html "https://resultados.tse.jus.br/oficial/app/index.html"
          curl -sS -A "$UA" -o /tmp/runtime.js "https://resultados.tse.jus.br/oficial/app/runtime.006aae974d2d266d.js"
          mkdir -p /tmp/js
          python3 - /tmp/runtime.js <<'PYEOF' > /tmp/chunk_ids.txt
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          apelidos = dict(re.findall(r'(\d+):"([a-zA-Z0-9_-]+)"', text.split('[e]||e')[0][-500:]))
          pairs = re.findall(r'(\d+):"([0-9a-f]{16,20})"', text)
          seen = set()
          for cid, h in pairs:
              if (cid, h) in seen: continue
              seen.add((cid, h))
              nome = apelidos.get(cid, cid)
              print(f"{nome}.{h}.js")
          PYEOF
          cat /tmp/chunk_ids.txt | xargs -P 20 -I{} sh -c \
            'curl -sS --max-time 6 -A "'"$UA"'" -o "/tmp/js/{}" "https://resultados.tse.jus.br/oficial/app/{}" || true'
          ls /tmp/js | wc -l

      - name: Contexto completo em volta de dados-simplificados / ele-c.json / assets json
        run: |
          set +e
          echo "=== contexto grande em volta de 'dados-simplificados' (chunk 130) ==="
          grep -o '.\{0,400\}dados-simplificados.\{0,400\}' /tmp/js/130.*.js
          echo ""
          echo "=== contexto em volta de 'ele-c.json' ==="
          grep -o '.\{0,300\}ele-c\.json.\{0,300\}' /tmp/js/*.js
          echo ""
          echo "=== contexto em volta de 'municipios-1.json' ==="
          grep -o '.\{0,200\}municipios-1\.json.\{0,200\}' /tmp/js/*.js
          exit 0

      - name: Tentar baixar ele-c.json em vários caminhos plausíveis
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for url in \
            "https://resultados.tse.jus.br/oficial/app/assets/config/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/app/assets/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/config/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/data/ele-c.json"; do
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -A "$UA" "$url")
            echo "--- $url -> HTTP $code ---"
            if [ "$code" = "200" ]; then head -c 800 /tmp/resp.json; echo ""; fi
          done
          exit 0
