name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Achar snapshot de 2022 do ele-c.json no Wayback Machine
        run: |
          set -x
          curl -sS --max-time 15 "https://archive.org/wayback/available?url=resultados.tse.jus.br/oficial/comum/config/ele-c.json&timestamp=20221101" || echo "FALHOU available"
          echo ""
          curl -sS --max-time 15 "https://web.archive.org/cdx/search/cdx?url=resultados.tse.jus.br/oficial/comum/config/ele-c.json&output=json&limit=30" || echo "FALHOU cdx"

      - name: Baixar o snapshot mais próximo de out/2022 e procurar pleito de GO 2022
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS --max-time 20 -A "$UA" -o /tmp/wb.json "https://web.archive.org/web/20221101000000/https://resultados.tse.jus.br/oficial/comum/config/ele-c.json" || echo "FALHOU download"
          wc -c /tmp/wb.json
          head -c 500 /tmp/wb.json
          echo ""
          python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/wb.json', encoding='utf-8'))
          except Exception as e:
              print("ERRO AO PARSEAR:", e)
              raise SystemExit
          print("ciclo (c):", d.get('c'))
          print("total pleitos:", len(d.get('pl', [])))
          for pleito in d.get('pl', []):
              for eleicao in pleito.get('e', []):
                  if eleicao.get('cd') == '544' or '2022' in (eleicao.get('nm') or ''):
                      print("PLEITO", pleito.get('cd'), "ELEICAO", eleicao.get('cd'), eleicao.get('nm'))
          PYEOF
