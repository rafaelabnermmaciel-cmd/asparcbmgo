name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Testar agencia.tse.jus.br (dominio legado, usado pelo mirror.sh do turicas)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "=== HEAD http (2022) ==="
          curl -sS -I -L -A "$UA" "http://agencia.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_2022.zip"
          echo "=== HEAD https (2022) ==="
          curl -sS -I -L -A "$UA" "https://agencia.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_2022.zip"
          echo "=== HEAD consulta_cand 2022 ==="
          curl -sS -I -L -A "$UA" "https://agencia.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2022.zip"
