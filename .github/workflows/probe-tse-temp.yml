name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Achar snapshot de 2022 do ele-c.json no Wayback Machine
        run: |
          set -x
          curl -sS --max-time 15 "https://archive.org/wayback/available?url=resultados.tse.jus.br/oficial/comum/config/ele-c.json&timestamp=20221101" || echo "FALHOU available"

      - name: Baixar o snapshot exato confirmado (id_ = conteúdo bruto, sem reescrita)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS --max-time 25 -A "$UA" -o /tmp/wb.json "https://web.archive.org/web/20221102031545id_/https://resultados.tse.jus.br/oficial/comum/config/ele-c.json"
          wc -c /tmp/wb.json

      - name: Tentar baixar o arquivo consolidado por município (federal, GO) direto do TSE
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          URLS=(
            "https://resultados.tse.jus.br/oficial/ele2022/dados-simplificados/go/go-c0006-e000544-r.json"
            "https://resultados.tse.jus.br/oficial/ele2022/544/dados-simplificados/go/go-c0006-e000544-r.json"
            "https://web.archive.org/web/20221105000000id_/https://resultados.tse.jus.br/oficial/ele2022/dados-simplificados/go/go-c0006-e000544-r.json"
          )
          for URL in "${URLS[@]}"; do
            echo "=== $URL ==="
            CODE=$(curl -sS --max-time 20 -A "$UA" -o /tmp/mun.json -w "%{http_code}" "$URL" || echo "ERR")
            echo "http_code=$CODE"
            wc -c /tmp/mun.json
            head -c 400 /tmp/mun.json
            echo ""
            echo "---"
          done
