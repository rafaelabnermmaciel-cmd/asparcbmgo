name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Buscar pacote CKAN
        run: |
          set -x
          curl -sS -D /tmp/pkg.headers -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" "https://dadosabertos.tse.jus.br/api/3/action/package_search?q=votacao+candidato+munzona+2022&rows=5" -o /tmp/pkg.json
          echo "=== headers ==="
          cat /tmp/pkg.headers
          echo "=== tamanho ==="
          wc -c /tmp/pkg.json
          echo "=== primeiros 2000 bytes ==="
          head -c 2000 /tmp/pkg.json
          echo ""
          jq '.result.results | length' /tmp/pkg.json
          jq -r '.result.results[] | "---\nname: \(.name)\ntitle: \(.title)\nnum_resources: \(.resources | length)"' /tmp/pkg.json

      - name: Listar recursos do primeiro pacote
        run: |
          jq -r '.result.results[0].resources[] | "\(.format) | \(.name) | \(.url)"' /tmp/pkg.json | head -100

      - name: Achar recurso de GO e baixar
        run: |
          set -x
          jq -r '.result.results[0].resources[] | select((.format|ascii_upcase)=="CSV" and (.name|ascii_upcase|contains("GO"))) | .url' /tmp/pkg.json | tee /tmp/go_urls.txt
          URL=$(head -1 /tmp/go_urls.txt)
          if [ -n "$URL" ]; then
            echo "URL: $URL"
            curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" -o /tmp/go.csv.zip "$URL" || curl -sS -A "Mozilla/5.0" -o /tmp/go.data "$URL"
            ls -la /tmp/go.csv.zip /tmp/go.data 2>/dev/null || true
            file /tmp/go.csv.zip 2>/dev/null || true
          fi

      - name: Extrair
        run: |
          set -x
          cd /tmp
          if [ -f go.csv.zip ]; then
            unzip -o go.csv.zip -d go_extracted || true
            ls -la go_extracted || true
          fi

      - name: Inspecionar
        run: |
          set -x
          cd /tmp
          F=$(find go_extracted -iname "*.csv" 2>/dev/null | head -1)
          if [ -z "$F" ] && [ -f go.data ]; then F=go.data; fi
          echo "ARQUIVO: $F"
          if [ -n "$F" ]; then
            iconv -f ISO-8859-1 -t UTF-8 "$F" | head -1
            echo "=== total linhas ==="
            wc -l "$F"
            echo "=== grep Alessandro Moreira (deputado estadual conhecido) ==="
            iconv -f ISO-8859-1 -t UTF-8 "$F" | grep -i "ALESSANDRO MOREIRA" | head -5
            echo "=== grep um deputado federal conhecido (Adriano do Baldy) ==="
            iconv -f ISO-8859-1 -t UTF-8 "$F" | grep -i "BALDY" | head -5
            echo "=== cargos distintos ==="
            iconv -f ISO-8859-1 -t UTF-8 "$F" | awk -F';' 'NR==1{for(i=1;i<=NF;i++) if($i ~ /DS_CARGO/) col=i} NR>1{print $col}' | sort -u
          fi
