name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar página da Wikipédia sobre eleições 2022 em Goiás
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" -o /tmp/wiki.html "https://pt.wikipedia.org/wiki/Elei%C3%A7%C3%B5es_estaduais_em_Goi%C3%A1s_em_2022"
          wc -c /tmp/wiki.html

      - name: Usar a API da Wikipédia (wikitext bruto, mais fácil de parsear)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" -o /tmp/wiki.json \
            "https://pt.wikipedia.org/w/api.php?action=parse&page=Elei%C3%A7%C3%B5es_estaduais_em_Goi%C3%A1s_em_2022&prop=wikitext&format=json"
          wc -c /tmp/wiki.json

      - name: Procurar tabelas de deputados federais e estaduais eleitos no wikitext
        run: |
          python3 - <<'PYEOF'
          import json, re
          d = json.load(open('/tmp/wiki.json', encoding='utf-8'))
          text = d.get('parse', {}).get('wikitext', {}).get('*', '')
          print("tamanho do wikitext:", len(text))
          for m in re.finditer(r'^==+\s*(.+?)\s*==+$', text, re.MULTILINE):
              print("SECAO:", m.group(1))

          def secao(nome):
              m = re.search(r'^==+\s*' + re.escape(nome) + r'\s*==+$', text, re.MULTILINE)
              if not m:
                  print(f"NAO ACHOU SECAO: {nome}")
                  return
              start = m.end()
              m2 = re.search(r'^==', text[start:], re.MULTILINE)
              end = start + m2.start() if m2 else len(text)
              print(f"\n\n===== CONTEUDO DE '{nome}' =====")
              print(text[start:end])

          secao('Deputados federais eleitos por Goiás')
          secao('Deputados estaduais eleitos em Goiás')

          # "Senador" aparece 2x (candidatos e resultados) - pegar só dentro de "Resultados"
          mres = re.search(r'^==\s*Resultados\s*==$', text, re.MULTILINE)
          if mres:
              resultados_txt = text[mres.end():]
              msen = re.search(r'^===+\s*Senador\s*===+$', resultados_txt, re.MULTILINE)
              if msen:
                  start = msen.end()
                  m2 = re.search(r'^===?', resultados_txt[start:], re.MULTILINE)
                  end = start + m2.start() if m2 else len(resultados_txt)
                  print("\n\n===== CONTEUDO DE 'Senador' (dentro de Resultados) =====")
                  print(resultados_txt[start:end])
          PYEOF
