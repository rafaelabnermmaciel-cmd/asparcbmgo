name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar index + runtime.js e extrair mapa de chunks
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -o /tmp/index.html "https://resultados.tse.jus.br/oficial/app/index.html"
          curl -sS -A "$UA" -o /tmp/runtime.js "https://resultados.tse.jus.br/oficial/app/runtime.006aae974d2d266d.js"
          mkdir -p /tmp/js
          python3 - /tmp/runtime.js <<'PYEOF' > /tmp/chunk_ids.txt
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          apelidos = dict(re.findall(r'(\d+):"([a-zA-Z0-9_-]+)"', text.split('[e]||e')[0][-500:]))
          pairs = re.findall(r'(\d+):"([0-9a-f]{16,20})"', text)
          seen = set()
          for cid, h in pairs:
              if (cid, h) in seen: continue
              seen.add((cid, h))
              nome = apelidos.get(cid, cid)
              print(f"{nome}.{h}.js")
          PYEOF
          cat /tmp/chunk_ids.txt | xargs -P 20 -I{} sh -c \
            'curl -sS --max-time 6 -A "'"$UA"'" -o "/tmp/js/{}" "https://resultados.tse.jus.br/oficial/app/{}" || true'
          ls /tmp/js | wc -l

      - name: Contexto completo em volta de dados-simplificados / ele-c.json / assets json
        run: |
          set -x
          python3 - <<'PYEOF'
          import glob, re

          def contexto(path, termo, antes=400, depois=400):
              text = open(path, encoding='utf-8', errors='replace').read()
              out = []
              for m in re.finditer(re.escape(termo), text):
                  a, b = max(0, m.start() - antes), min(len(text), m.end() + depois)
                  out.append(text[a:b])
              return out

          print("=== 'dados-simplificados' no chunk 130 ===")
          for f in glob.glob('/tmp/js/130.*.js'):
              for c in contexto(f, 'dados-simplificados')[:3]:
                  print(c)
                  print('---')

          print("=== 'ele-c.json' em qualquer chunk ===")
          for f in glob.glob('/tmp/js/*.js'):
              for c in contexto(f, 'ele-c.json', 300, 300)[:3]:
                  print(f, '::', c)
                  print('---')

          print("=== 'municipios-1.json' em qualquer chunk ===")
          for f in glob.glob('/tmp/js/*.js'):
              for c in contexto(f, 'municipios-1.json', 200, 200)[:2]:
                  print(f, '::', c)
                  print('---')
          PYEOF

      - name: Achar definição de carregarComum/carregarCiclo (classe repositorio)
        run: |
          set -x
          python3 - <<'PYEOF'
          import glob, re

          def contexto(path, termo, antes=200, depois=600):
              text = open(path, encoding='utf-8', errors='replace').read()
              out = []
              for m in re.finditer(re.escape(termo), text):
                  a, b = max(0, m.start() - antes), min(len(text), m.end() + depois)
                  out.append(text[a:b])
              return out

          for termo in ['carregarComum(', 'carregarCiclo(', 'class Repositorio', 'apiUrl', 'urlBase:']:
              print(f"=== '{termo}' ===")
              achou = False
              for f in glob.glob('/tmp/js/*.js'):
                  for c in contexto(f, termo)[:2]:
                      achou = True
                      print(f, '::', c)
                      print('---')
              if not achou:
                  print('(nada encontrado)')
          PYEOF

      - name: Tentar baixar ele-c.json em vários caminhos plausíveis
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for url in \
            "https://resultados.tse.jus.br/oficial/comum/config/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/config/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/data/comum/config/ele-c.json" \
            "https://resultados.tse.jus.br/config/ele-c.json" \
            "https://resultados.tse.jus.br/oficial/ele-c.json"; do
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -A "$UA" "$url")
            echo "--- $url -> HTTP $code ---"
            if [ "$code" = "200" ]; then head -c 1500 /tmp/resp.json; echo ""; fi
          done
          exit 0
