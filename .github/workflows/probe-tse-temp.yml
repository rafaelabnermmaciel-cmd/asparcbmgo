name: Probe TSE Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Achar snapshot de 2022 do ele-c.json no Wayback Machine
        run: |
          set -x
          curl -sS --max-time 15 "https://archive.org/wayback/available?url=resultados.tse.jus.br/oficial/comum/config/ele-c.json&timestamp=20221101" || echo "FALHOU available"

      - name: Baixar o snapshot exato confirmado (id_ = conteúdo bruto, sem reescrita)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS --max-time 25 -A "$UA" -o /tmp/wb.json "https://web.archive.org/web/20221102031545id_/https://resultados.tse.jus.br/oficial/comum/config/ele-c.json"
          wc -c /tmp/wb.json

      - name: Ver o conteúdo completo do catálogo ele-c.json (procurar template de arquivo)
        run: |
          cat /tmp/wb.json
          echo ""
          echo "=== tamanho ==="
          wc -c /tmp/wb.json

      - name: Tentar eleicao 546 (estadual — onde estao dep. federal/senador/estadual)
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          URLS=(
            "https://resultados.tse.jus.br/oficial/ele2022/dados-simplificados/go/go-c0006-e000546-r.json"
            "https://resultados.tse.jus.br/oficial/ele2022/dados-simplificados/go/go-c0005-e000546-r.json"
            "https://resultados.tse.jus.br/oficial/ele2022/dados-simplificados/go/go-c0007-e000546-r.json"
            "https://resultados.tse.jus.br/oficial/ele2022/dados-simplificados/go/go-c0003-e000546-r.json"
          )
          for URL in "${URLS[@]}"; do
            echo "=== $URL ==="
            CODE=$(curl -sS --max-time 15 -A "$UA" -o /tmp/mun.json -w "%{http_code}" "$URL" || echo "ERR")
            echo "http_code=$CODE  tamanho=$(wc -c < /tmp/mun.json)"
            head -c 500 /tmp/mun.json
            echo ""
            echo "---"
          done
