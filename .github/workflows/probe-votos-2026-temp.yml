name: Probe Votos 2026 Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Roda fetch + aplicar resultados 2026
        working-directory: painel-captacao
        run: |
          node scripts/fetch-votos-go-2026.js
          node scripts/aplicar-resultados-2026.js
      - name: Mostra mudancas-casa-2026.json
        working-directory: painel-captacao
        run: cat mudancas-casa-2026.json
      - name: Conta quantos tem aviso2026 / notaEleicao2026 / sao novos
        working-directory: painel-captacao
        run: |
          node -e '
          const p = require("./public/data/parlamentares-go.json");
          console.log("total:", p.length);
          console.log("com aviso2026:", p.filter((x) => x.aviso2026).length);
          console.log("com notaEleicao2026:", p.filter((x) => x.notaEleicao2026).length);
          console.log("novos (id 2026-*):", p.filter((x) => String(x.id).startsWith("2026-")).length);
          p.filter((x) => x.notaEleicao2026).forEach((x) => console.log(" MUDOU:", x.casa, x.id, x.nome, "->", x.notaEleicao2026));
          p.filter((x) => x.aviso2026).forEach((x) => console.log(" AVISO:", x.casa, x.id, x.nome));
          '
      - name: Verifica se Cardoso virou novo e nao bateu com o senador
        working-directory: painel-captacao
        run: |
          node -e '
          const p = require("./public/data/parlamentares-go.json");
          const cardoso = p.filter((x) => x.nome === "Cardoso");
          console.log("Cardoso novo:", JSON.stringify(cardoso));
          const vanderlan = p.find((x) => x.nome === "Vanderlan Cardoso");
          console.log("Vanderlan Cardoso:", JSON.stringify(vanderlan));
          '
