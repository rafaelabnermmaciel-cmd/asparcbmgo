name: Probe Votos 2026 Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dump bruto da tabela de deputados federais
        working-directory: painel-captacao
        run: node scripts/dump-federal-temp.mjs
