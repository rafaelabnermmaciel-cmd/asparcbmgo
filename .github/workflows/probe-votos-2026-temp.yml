name: Probe Votos 2026 Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/resource-capture-panel-rxvxiu
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Roda fetch + aplicar resultados 2026
        working-directory: painel-captacao
        run: |
          node scripts/fetch-votos-go-2026.js
          node scripts/aplicar-resultados-2026.js
      - name: Commita e envia os dados de 2026 pra branch de trabalho
        working-directory: painel-captacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/votos-go-2026.json public/data/parlamentares-go.json
          git commit -m "data: aplica resultado da eleicao de 2026 (votos e cadastro)"
          git push origin HEAD:claude/resource-capture-panel-rxvxiu
