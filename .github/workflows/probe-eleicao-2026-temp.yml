name: Probe Eleição 2026 Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixa o wikitext do artigo de 2026 e procura secao de Resultados
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          curl -sS --max-time 25 -A "$UA" -G "https://pt.wikipedia.org/w/api.php" \
            --data-urlencode "action=parse" \
            --data-urlencode "page=Eleições estaduais em Goiás em 2026" \
            --data-urlencode "prop=wikitext" \
            --data-urlencode "format=json" -o /tmp/wt2026.json
          wc -c /tmp/wt2026.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/wt2026.json', encoding='utf-8'))
          wt = d.get('parse', {}).get('wikitext', {}).get('*', '')
          print("tamanho wikitext:", len(wt))
          for titulo in ['Deputados federais', 'Deputados estaduais']:
              for marcador in [f'==={titulo}===', f'== {titulo} ==', f'==={titulo} ===', f'=== {titulo}===']:
                  idx = wt.find(marcador)
                  if idx != -1:
                      print(f"\n\n========== {titulo} achado com '{marcador}' idx={idx} ==========")
                      print(wt[idx:idx+2500])
                      break
              else:
                  print(f"\n\n========== {titulo}: NENHUM MARCADOR BATEU ==========")
          PYEOF
