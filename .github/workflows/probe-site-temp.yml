name: Probe Site Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirma se o host do Supabase existe de verdade (DNS publico, sem depender do runner)
        run: |
          set -x
          echo "=== nslookup local ==="
          nslookup nppaeyxaxcraitpmwyqo.supabase.co || echo "nslookup falhou"
          echo "=== Google DNS-over-HTTPS ==="
          curl -sS --max-time 10 "https://dns.google/resolve?name=nppaeyxaxcraitpmwyqo.supabase.co&type=A"
          echo
          echo "=== Cloudflare DNS-over-HTTPS ==="
          curl -sS --max-time 10 -H "accept: application/dns-json" "https://cloudflare-dns.com/dns-query?name=nppaeyxaxcraitpmwyqo.supabase.co&type=A"
          echo
          echo "=== supabase.co em si resolve? (dominio pai) ==="
          curl -sS --max-time 10 "https://dns.google/resolve?name=supabase.co&type=A"
