name: Probe Site Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instala playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Abre o site do zero (sem hash na URL) e entra com a senha
        run: |
          cat > test.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const logs = [];
          page.on('console', (msg) => logs.push(`[console ${msg.type()}] ${msg.text()}`));
          page.on('pageerror', (err) => logs.push(`[pageerror] ${err.message}`));

          console.log('--- Passo 1: abre a URL base (sem hash), igual a pessoa abrindo o link pela primeira vez ---');
          await page.goto('https://rafaelabnermmaciel-cmd.github.io/asparcbmgo/painel-captacao-app/', { waitUntil: 'networkidle' });
          console.log('URL depois de abrir:', page.url());

          const senhaInput = await page.$('input[type="password"]');
          if (senhaInput) {
            console.log('--- Achou a tela de senha, digitando ---');
            await senhaInput.fill('@aspar2026');
            await page.keyboard.press('Enter');
            await page.waitForTimeout(2000);
          } else {
            console.log('--- NAO achou tela de senha (?) ---');
          }

          console.log('URL depois de entrar com a senha:', page.url());
          const titulo = await page.title();
          console.log('Titulo da pagina:', titulo);
          const corpoTexto = await page.evaluate(() => document.body.innerText.slice(0, 500));
          console.log('Texto visivel no corpo (primeiros 500 chars):', JSON.stringify(corpoTexto));

          await page.screenshot({ path: 'depois-senha.png', fullPage: true });

          console.log('--- Logs do console/erros da pagina ---');
          logs.forEach((l) => console.log(l));

          await browser.close();
          EOF
          node test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: depois-senha.png
