name: Probe Comissoes Temp

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Camara - orgaos do deputado 121948
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          curl -sS --max-time 25 -A "$UA" \
            "https://dadosabertos.camara.leg.br/api/v2/deputados/121948/orgaos?itens=50" \
            -o /tmp/camara.json
          wc -c /tmp/camara.json
          cat /tmp/camara.json | head -c 4000
          echo

      - name: Senado - comissoes do senador 5895
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          curl -sS --max-time 25 -A "$UA" \
            "https://legis.senado.leg.br/dadosabertos/senador/5895/comissoes.json" \
            -o /tmp/senado.json
          wc -c /tmp/senado.json
          cat /tmp/senado.json | head -c 4000
          echo

      - name: Alego - perfil do deputado 808 (procura secao de comissoes, com retry)
        run: |
          set -x
          UA="painel-captacao-cbmgo/1.0 (uso interno, sem fins comerciais)"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -sS --max-time 30 -A "$UA" "https://portal.al.go.leg.br/deputados/perfil/808" -o /tmp/alego.html; then
              ok=1
              break
            fi
            echo "tentativa $i falhou, esperando..."
            sleep $((5 * i))
          done
          echo "ok=$ok"
          wc -c /tmp/alego.html || true
          echo "--- trechos com 'omiss' (comissão/comissões) ---"
          grep -o -i '.\{80\}omiss.\{300\}' /tmp/alego.html | head -c 6000 || echo "nenhuma ocorrencia de 'omiss' encontrada"
