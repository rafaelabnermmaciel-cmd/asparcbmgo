name: _Sondagem temporária ALEGO (apagar depois)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar lista de deputados e um perfil individual
        run: |
          set +e
          curl -s -L --max-time 20 -A "Mozilla/5.0" "https://portal.al.go.leg.br/deputados" -o /tmp/page.html
          echo "=== quantidade de linhas de deputado (data-title=Nome) ==="
          grep -o 'data-title="Nome"' /tmp/page.html | wc -l
          echo "=== todos os hrefs /deputados/perfil/N encontrados (id + nome) ==="
          grep -oE 'href=/deputados/perfil/[0-9]+>[^<]+' /tmp/page.html | sort -u
          echo ""
          echo "=== baixando perfil de exemplo (825) ==="
          curl -s -L --max-time 20 -A "Mozilla/5.0" "https://portal.al.go.leg.br/deputados/perfil/825" -o /tmp/perfil.html
          echo "tamanho: $(wc -c < /tmp/perfil.html) bytes"
          echo "--- imgs no perfil ---"
          grep -oE '<img[^>]+>' /tmp/perfil.html | head -20
          echo "--- trecho ao redor da 1a img ---"
          python3 - <<'EOF'
          t = open('/tmp/perfil.html', encoding='utf-8', errors='replace').read()
          i = t.find('<img')
          print(t[max(0,i-1200):i+1200] if i >= 0 else "nenhuma <img> encontrada")
          EOF
          echo "--- ocorrencias de gabinete/telefone/email no perfil ---"
          grep -ioE '.{0,60}(gabinete|e-?mail|telefone|nascimento|profiss).{0,80}' /tmp/perfil.html | head -40
